stages:
    - build

variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    PACKAGE_NAME: "war"

build-tag:
    stage: build
    image: maven:3.9.6-eclipse-temurin-17
    rules:
        - if: '$CI_COMMIT_TAG'
    script:
        - mvn clean package
        - mv /miso-web/target/ROOT.war ROOT.war
    artifacts:
        paths:
            - ROOT.war
        expire_in: 1 week
