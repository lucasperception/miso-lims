spec:
    inputs: 
        tag: 
            description: "Tag to deploy (e.g. v1.0.1 or feature-xyz-rc1)"
            type: string 
        environment: 
            description: "Environment to deploy to" 
            type: string 
            default: "stage" 
            options: 
                - stage
                - prod

---
stages:
    - build
    - deploy

variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    PACKAGE_NAME: "war"

build-publish-tag:
    stage: build
    image: maven:3.9.6-eclipse-temurin-17
    rules:
        - if: '$CI_COMMIT_TAG'
    script:
        - mvn clean package
        - mv /builds/core/miso/miso-web/target/ROOT.war ROOT.war
        - | 
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
                 --upload-file ROOT.war \
                 "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/miso/$CI_COMMIT_TAG/ROOT.war"
    artifacts:
        paths:
            - ROOT.war
        expire_in: 1 week

deploy-tag:
    stage: deploy
    image: alpine:latest
    when: manual
    needs: []
    rules:
        - when: manual
    script:
        - echo "Deploying tag $[[ inputs.tag ]] to environment $[[ inputs.environment ]]"
        - |
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --output ROOT.war \
               "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/miso/$[[ inputs.tag ]]/ROOT.war" 
        - ls

