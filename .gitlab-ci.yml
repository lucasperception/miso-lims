stages:
    - build

variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    PACKAGE_NAME: "war"

build-publish-tag:
    stage: build
    image: maven:3.9.6-eclipse-temurin-17
    rules:
        - if: '$CI_COMMIT_TAG'
    script:
        - mvn clean package
        - mv /builds/core/miso/miso-web/target/ROOT.war ROOT.war
        - | 
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
                 --upload-file ROOT.war \
                 "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/miso/$CI_COMMIT_TAG/ROOT.war"
    artifacts:
        paths:
            - ROOT.war
        expire_in: 1 week
